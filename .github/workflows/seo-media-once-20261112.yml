name: Temporary guide metadata and media repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-media-once-20261112.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and publish exact-media SEO update
        shell: bash
        run: |
          python3 - <<'PY'
          CONFIG = {"short":"rome1","source":"d6ecdc060a128faf12a095502e7dbfb3b88f5c74","old":"The Fall of Rome — R.A. Lafferty (1971)","title":"The Fall of Rome: Study Guide | R. A. Lafferty","description":"A guide to R. A. Lafferty’s The Fall of Rome, with chapter summaries, historical sources, chronology, locations, and notes on Gibbon and Zosimus.","count":2}
          import base64, hashlib, html, json, os, re, subprocess, tempfile
          from pathlib import Path
          from html.parser import HTMLParser
          
          def git_sha(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          def digest(raw):
              return hashlib.sha256(raw).hexdigest()
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          
          original = Path('index.html').read_bytes()
          assert git_sha(original) == CONFIG['source'], 'Source changed: stop for review'
          url = 'https://mumbrumber101-hub.github.io/' + CONFIG['short'] + '/'
          title_match = re.search(rb'<title\b[^>]*>.*?</title>', original, re.S | re.I)
          assert title_match and len(re.findall(rb'<title\b', original, re.I)) == 1
          assert html.unescape(re.sub(r'</?title[^>]*>', '', title_match.group().decode(), flags=re.I)) == CONFIG['old']
          head = re.search(rb'<head\b[^>]*>(.*?)</head>', original, re.S | re.I).group(1)
          assert not re.search(rb'<meta\b[^>]*(?:name\s*=\s*["\'](?:description|twitter:)|property\s*=\s*["\']og:)', head, re.I), 'Metadata changed: stop for review'
          assert not re.search(rb'<link\b[^>]*rel\s*=\s*["\']canonical', head, re.I)
          data = re.compile(rb'data:([^;,"\'<>\s]+)(?:;[^,"\'<>\s]+)*;base64,([A-Za-z0-9+/=\r\n]+)')
          extensions = {'image/jpeg': 'jpg', 'image/webp': 'webp', 'audio/mpeg': 'mp3'}
          changed = original
          assets, replacements = [], []
          for match in data.finditer(original):
              mime = match.group(1).decode('ascii')
              payload = base64.b64decode(re.sub(rb'\s+', b'', match.group(2)), validate=True)
              checksum = digest(payload)
              path = 'assets/seo/' + checksum + '.' + extensions[mime]
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.exists():
                  assert target.read_bytes() == payload
              else:
                  target.write_bytes(payload)
              old, new = match.group(0), path.encode('ascii')
              assert new not in original
              changed = changed.replace(old, new)
              replacements.append((new, old))
              assets.append({'path':path,'mime':mime,'bytes':len(payload),'sha256':checksum,'blob_sha':git_sha(payload),'occurrences':original.count(old)})
          assert len(assets) == CONFIG['count']
          assert not data.search(changed)
          esc = lambda s: html.escape(s, quote=True)
          title, description = CONFIG['title'], CONFIG['description']
          tags = [
              '<title>' + esc(title) + '</title>',
              '<meta name="description" content="' + esc(description) + '">',
              '<link rel="canonical" href="' + url + '">',
              '<meta property="og:title" content="' + esc(title) + '">',
              '<meta property="og:description" content="' + esc(description) + '">',
              '<meta property="og:url" content="' + url + '">',
              '<meta property="og:site_name" content="Arrive at Easterwine">',
              '<meta name="twitter:card" content="summary">',
              '<meta name="twitter:title" content="' + esc(title) + '">',
              '<meta name="twitter:description" content="' + esc(description) + '">',
          ]
          metadata = '\n'.join(tags).encode('utf-8')
          changed = changed.replace(title_match.group(), metadata, 1)
          restored = changed.replace(metadata, title_match.group(), 1)
          for new, old in replacements:
              restored = restored.replace(new, old)
          assert restored == original, 'Exact inverse failed'
          assert re.findall(rb'<script\b[^>]*>.*?</script>', original, re.I|re.S) == re.findall(rb'<script\b[^>]*>.*?</script>', changed, re.I|re.S), 'Scripts changed'
          assert len(changed) < 2_000_000
          class BodyTokens(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.inside, self.events = False, []
              def handle_starttag(self, tag, attrs):
                  if tag == 'body': self.inside = True
                  if self.inside:
                      self.events.append(('start',tag,[(k,'[MEDIA]' if v and (v.startswith('data:') or v.startswith('assets/seo/')) else v) for k,v in attrs]))
              def handle_endtag(self, tag):
                  if self.inside: self.events.append(('end',tag))
              def handle_data(self, value):
                  if self.inside: self.events.append(('data',value))
              def handle_entityref(self, value):
                  if self.inside: self.events.append(('entity',value))
              def handle_charref(self, value):
                  if self.inside: self.events.append(('char',value))
          before, after = BodyTokens(), BodyTokens()
          before.feed(original.decode('utf-8'))
          after.feed(changed.decode('utf-8'))
          assert before.events == after.events, 'Body structure, text or controls changed'
          Path('index.html').write_bytes(changed)
          report = {
              'repo':os.environ['GITHUB_REPOSITORY'], 'url':url,
              'source_blob':git_sha(original), 'source_sha256':digest(original),
              'proposed_blob':git_sha(changed),'proposed_sha256':digest(changed),
              'before_bytes':len(original),'after_bytes':len(changed),
              'title':title,'description':description,'assets':assets,
              'verification':{'source_sha_matched':True,'inverse_byte_exact':True,'body_tokens_equal':True,'scripts_byte_equal':True,'all_base64_media_externalized':True,'html_under_2mb':True}
          }
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('add','--','index.html','assets/seo')
          staged = git('diff','--cached','--name-only').splitlines()
          assert set(staged) == {'index.html', *(a['path'] for a in assets)}, staged
          message = 'Improve guide discovery and externalize unchanged media\n\nSEO_VERIFICATION_JSON\n' + json.dumps(report, ensure_ascii=False, separators=(',',':'))
          with tempfile.NamedTemporaryFile(mode='w', encoding='utf-8', delete=False) as f:
              f.write(message)
              message_path = f.name
          git('commit','-F',message_path)
          os.unlink(message_path)
          git('push','origin','HEAD:main')
          report['commit'] = git('rev-parse','HEAD')
          print(json.dumps(report, ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Completed exact-media SEO repair.\n\n    '+json.dumps(report,ensure_ascii=False))
          
          PY
